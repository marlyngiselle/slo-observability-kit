# Local Prometheus. Application metrics arrive through the collector's remote write,
# so the only scrape jobs here are the monitoring stack itself.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
