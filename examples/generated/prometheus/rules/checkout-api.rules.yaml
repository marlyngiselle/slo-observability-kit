- name: slo-checkout-api-availability-alerts
  rules:
  - alert: CheckoutApiAvailabilityBudgetBurn
    expr: |
      (
        slo:sli_error:ratio_rate1h{service="checkout-api",slo="availability"} > 0.0144
        and
        slo:sli_error:ratio_rate5m{service="checkout-api",slo="availability"} > 0.0144
      )
      or
      (
        slo:sli_error:ratio_rate6h{service="checkout-api",slo="availability"} > 0.006
        and
        slo:sli_error:ratio_rate30m{service="checkout-api",slo="availability"} > 0.006
      )
    for: 2m
    labels:
      severity: page
      team: payments-oncall
      service: checkout-api
      slo: availability
      tier: '1'
      channel: '#payments-oncall'
    annotations:
      summary: checkout-api availability is burning its error budget fast
      description: 'Checkout requests that do not fail with a server error. Objective 99.9% over 28d. Long window error ratio is {{ $value | humanizePercentage }} against a budget of 0.1%. Fires on 14.4x over 1h/5m, 6x over 6h/30m. Budget exhaustion at that rate: 46.7h at 14.4x, 112h at 6x.'
