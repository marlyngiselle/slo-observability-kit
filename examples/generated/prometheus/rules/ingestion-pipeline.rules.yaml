- name: slo-ingestion-pipeline-freshness-alerts
  rules:
  - alert: IngestionPipelineFreshnessBudgetBurn
    expr: |
      (
        slo:sli_error:ratio_rate1h{service="ingestion-pipeline",slo="freshness"} > 0.072
        and
        slo:sli_error:ratio_rate5m{service="ingestion-pipeline",slo="freshness"} > 0.072
      )
      or
      (
        slo:sli_error:ratio_rate6h{service="ingestion-pipeline",slo="freshness"} > 0.03
        and
        slo:sli_error:ratio_rate30m{service="ingestion-pipeline",slo="freshness"} > 0.03
      )
    for: 2m
    labels:
      severity: page
      team: data-platform-oncall
      service: ingestion-pipeline
      slo: freshness
      tier: '2'
    annotations:
      summary: ingestion-pipeline freshness is burning its error budget fast
      description: 'Minutes during which the events table is less than 15 minutes old. Objective 99.5% over 30d. Long window error ratio is {{ $value | humanizePercentage }} against a budget of 0.5%. Fires on 14.4x over 1h/5m, 6x over 6h/30m. Budget exhaustion at that rate: 50h at 14.4x, 120h at 6x.'
      runbook_url: https://runbooks.example.com/ingestion-pipeline#freshness
      dashboard: /d/slo-ingestion-pipeline
